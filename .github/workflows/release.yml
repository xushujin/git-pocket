name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        env:
          GITPOCKET_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          GITPOCKET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          GITPOCKET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GITPOCKET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GIT_TAG: ${{ github.ref_name }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release.apk.sha256 \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/mapping/release/mapping.txt \
            --title "GitPocket $GITHUB_REF_NAME" \
            --generate-notes
