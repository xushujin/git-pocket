name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "缺少 KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests + lint
        # 发布前先过一遍：tag 一旦推上去就会直接产出 Release，不能带着红灯出包
        run: ./gradlew test lintDebug --stacktrace

      - name: Build signed release
        env:
          GITPOCKET_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          GITPOCKET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          GITPOCKET_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GITPOCKET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GIT_TAG: ${{ github.ref_name }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # 产物名带版本号（GitPocket-<versionName>.apk），这里解析出实际路径供后续步骤复用
      - name: Resolve artifact name
        id: apk
        run: |
          APK=$(ls app/build/outputs/apk/release/GitPocket-*.apk | head -1)
          if [ -z "$APK" ]; then
            echo "没有找到 GitPocket-*.apk" >&2
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$APK")" >> "$GITHUB_OUTPUT"
          echo "APK = $APK"

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}"

      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum "${{ steps.apk.outputs.name }}" > "${{ steps.apk.outputs.name }}.sha256"
          cat "${{ steps.apk.outputs.name }}.sha256"

      # mapping.txt 原始 26MB，压缩后约 2MB；还原堆栈前先 gunzip
      - name: Compress mapping
        run: |
          gzip -9 -c app/build/outputs/mapping/release/mapping.txt \
            > app/build/outputs/mapping/release/mapping.txt.gz
          ls -lh app/build/outputs/mapping/release/mapping.txt.gz

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.apk.outputs.path }}" \
            "${{ steps.apk.outputs.path }}.sha256" \
            app/build/outputs/mapping/release/mapping.txt.gz \
            --title "GitPocket $GITHUB_REF_NAME" \
            --generate-notes
