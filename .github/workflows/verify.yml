name: verify

# 只有推送 tag 才会自动触发构建（见 release.yml）。
# 这个工作流只用于手动跑单测 + lint：仓库 → Actions → verify → Run workflow。
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # 零警告：CI 上强制 allWarningsAsErrors
      - name: Unit tests (JVM)
        run: ./gradlew :core:git:test --stacktrace -Pgitpocket.werror=true

      - name: Lint
        run: ./gradlew lintDebug
